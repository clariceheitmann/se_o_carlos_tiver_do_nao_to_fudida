<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/style.css">
    <script src="../js/condominio_cad.js"defer></script>
    <title>Cadastrar Condomínio</title>
</head>
<body>
    <header>
        <nav><a href="../index.html">Home</a></nav>
    </header>

    <main>
        <h1>Cadastrar Condomínio</h1>
        <br><hr><br>
        <form>
            <label for="nome">Nome</label>
            <input type="text" id="nome" required><br>

            <label for="cnpj">CNPJ</label>
            <input type="number" id="cnpj" required><br>

            <button id="btn_cadastrar">Cadastrar</button>
        </form>
        <div id="resposta" class="resposta"></div>
    </main>
</body>
</html>
