<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/style.css">
    <script src="../js/material_cad.js"defer></script>
    <title>Cadastrar Material</title>
</head>
<body>
    <header>
        <nav><a href="../index.html">Home</a></nav>
    </header>

    <main>
        <h1>Cadastrar Material</h1>
        <br><hr><br>
        <form>
            <label for="descricao">Descrição</label>
            <input type="text" id="descricao" required><br>

            <label for="categoria">Categoria</label>
            <input type="text" id="categoria" required><br>

            <label for="quantidadeEstoque">Quantidade em Estoque</label>
            <input type="number" id="quantidadeEstoque" required><br>

            <label for="codigoLote">Codigo Lote</label>
            <input type="number" id="codigoLote" required><br>

            <label for="idCondominio">Código do Condomínio</label>
            <input type="number" id="idCondominio" required><br>

            <button id="btn_cadastrar">Cadastrar</button>
        </form>
        <div id="resposta" class="resposta"></div>
    </main>
</body>
</html>
